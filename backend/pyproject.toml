[project]
name = "engbuddy-backend"
version = "1.0.0"
description = "EngBuddy Async FastAPI + SQLAlchemy 2 + pgvector + Celery/Redis Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "cryptography>=43.0.3",
    "PyJWT>=2.9.0",
    "httpx>=0.27.2",
    "opencv-python-headless>=4.10.0.84",
    "numpy>=2.1.0",
    "pypdf>=5.1.0",
    "boto3>=1.35.0",
    "google-genai>=0.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.7.3"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
