name: EngBuddy Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-test:
    name: Android Native (Kotlin + Room + Vision CV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  backend-lint-and-test:
    name: FastAPI Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check .
      - name: Typecheck with Mypy
        run: mypy app
      - name: Run Pytest
        run: pytest
